name: Build and push Docker images

# Раньше все три образа собирались прямо на проде (2ГБ VPS) через
# `docker compose build` — npm ci + nest build + два билда Next
# одновременно с работающими контейнерами регулярно уводили машину в своп
# (наблюдались билды по 15-20 минут, свободная RAM падала до 100-150МБ).
# Сборка здесь, на раннере GitHub, снимает эту нагрузку с сервера
# полностью — на проде остаётся только `docker compose pull && up -d`.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # https://api-adyutant.glb-engineering.kz — публичный адрес API, не
  # секрет, запекается в клиентский бандл web/miniapp на этапе сборки
  # (см. NEXT_PUBLIC_API_URL в Dockerfile'ах и в docker-compose.prod.yml).
  NEXT_PUBLIC_API_URL: https://api-adyutant.glb-engineering.kz

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: miniapp
            dockerfile: apps/miniapp/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ai-task-system-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ai-task-system-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
