name: Build and push Docker images

# Раньше все три образа собирались прямо на проде (2ГБ VPS) через
# `docker compose build` — npm ci + nest build + два билда Next
# одновременно с работающими контейнерами регулярно уводили машину в своп
# (наблюдались билды по 15-20 минут, свободная RAM падала до 100-150МБ).
# Сборка здесь, на раннере GitHub, снимает эту нагрузку с сервера
# полностью — на проде остаётся только `docker compose pull && up -d`.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # https://api-adyutant.glb-engineering.kz — публичный адрес API, не
  # секрет, запекается в клиентский бандл web/miniapp на этапе сборки
  # (см. NEXT_PUBLIC_API_URL в Dockerfile'ах и в docker-compose.prod.yml).
  NEXT_PUBLIC_API_URL: https://api-adyutant.glb-engineering.kz

jobs:
  # Аудит 10.09.2026, п. 5.2: раньше этот workflow только собирал и пушил
  # образы — сломанный код спокойно доехал бы до прода, единственной
  # проверкой был сам `docker build` (типы компилируются, но lint/тесты
  # никто не запускал). gate — обычный CI-гейт перед сборкой: prisma
  # validate + lint всех трёх воркспейсов + юнит-тесты api (RBAC-границы,
  # часовой пояс, проверка initData — см. *.spec.ts).
  gate:
    runs-on: ubuntu-latest
    env:
      # eslint (type-aware, @typescript-eslint) упирается в дефолтный
      # V8 old-space (~2ГБ) на этом же раннере, где физической RAM в разы
      # больше — тот же класс проблемы, что раньше был с tsc/eslint на
      # 2ГБ проде, просто здесь упирается не в физический потолок, а в
      # дефолт Node, который его тоже надо поднять явно.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      # prisma не поднят в корневой node_modules/.bin (та же причина, по
      # которой Dockerfile вызывает его через прямой путь до модуля, а не
      # `npx prisma` — npm workspaces его туда не хостит). DATABASE_URL —
      # `validate` реального подключения к БД не делает, но требует, чтобы
      # переменная была хоть чем-то заполнена (иначе падает на env()).
      - run: node apps/api/node_modules/prisma/build/index.js validate --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run lint --workspace=apps/api
      - run: npm run lint --workspace=apps/web
      - run: npm run lint --workspace=apps/miniapp
      - run: npm run test --workspace=apps/api

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: miniapp
            dockerfile: apps/miniapp/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ai-task-system-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ai-task-system-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
